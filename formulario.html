<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro</title>
  <script src="scriptformulario.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <!-- NAVEGACIÓN DE SECCIONES -->
 <nav class="nav-tabs">
    <a href="index.html" class="nav-btn">Volver</a>
</nav>

  <!-- SECCIÓN 1: FORMULARIO DE REGISTRO TIPO CLIENTE + CRUD -->
  <section id="sec-registro" class="tab-content active">
    <div class="card">
      <h2>Formulario de Registro de Clientes</h2>
      <p class="subtitle">Complete los campos solicitados. La información se guardará en localStorage.</p>

      <form id="registroForm" novalidate>
        <input type="hidden" id="userId">
        
        <div class="form-grid">
          
          <!-- 1. Nombre -->
          <div class="form-group" id="group-nombre">
            <label for="nombre">Nombre *</label>
            <div class="input-container">
              <input type="text" id="nombre" placeholder="Ej. Jonatan" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 2. Apellido -->
          <div class="form-group" id="group-apellido">
            <label for="apellido">Apellido *</label>
            <div class="input-container">
              <input type="text" id="apellido" placeholder="Ej. Arroyo" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 3. Teléfono -->
          <div class="form-group" id="group-telefono">
            <label for="telefono">Teléfono (10 dígitos) *</label>
            <div class="input-container">
              <input type="tel" id="telefono" placeholder="Ej. 3411234567" maxlength="10" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 4. Dirección -->
          <div class="form-group" id="group-direccion">
            <label for="direccion">Dirección *</label>
            <div class="input-container">
              <input type="text" id="direccion" placeholder="Ej. Av. Pellegrini 1234" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 5. Localidad -->
          <div class="form-group" id="group-localidad">
            <label for="localidad">Localidad *</label>
            <div class="input-container">
              <input type="text" id="localidad" placeholder="Ej. Rosario" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 6. Provincia (Select) -->
          <div class="form-group" id="group-provincia">
            <label for="provincia">Provincia *</label>
            <div class="input-container">
              <select id="provincia" required>
                <option value="">Seleccione una Provincia</option>
                <option value="Santa Fe">Santa Fe</option>
                <option value="Buenos Aires">Buenos Aires</option>
                <option value="CABA">CABA</option>
                <option value="Córdoba">Córdoba</option>
                <option value="Mendoza">Mendoza</option>
                <option value="Entre Ríos">Entre Ríos</option>
                <option value="San Luis">San Luis</option>
                <option value="Tucumán">Tucumán</option>
                <option value="Salta">Salta</option>
                <option value="Jujuy">Jujuy</option>
                <option value="Chaco">Chaco</option>
                <option value="Formosa">Formosa</option>
                <option value="Misiones">Misiones</option>
                <option value="Corrientes">Corrientes</option>
                <option value="La Pampa">La Pampa</option>
                <option value="Neuquén">Neuquén</option>
                <option value="Río Negro">Río Negro</option>
                <option value="San Juan">San Juan</option>
                <option value="Tierra del Fuego">Tierra del Fuego</option>
                <option value="Chubut">Chubut</option>
                <option value="Catamarca">Catamarca</option>
                <option value="La Rioja">La Rioja</option>
                <option value="Santa Cruz">Santa Cruz</option>
                 

              </select>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 7. Código Postal -->
          <div class="form-group" id="group-codigoPostal">
            <label for="codigoPostal">Código Postal *</label>
            <div class="input-container">
              <input type="text" id="codigoPostal" placeholder="Ej. 2000" maxlength="8" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- 8. Email -->
          <div class="form-group" id="group-email">
            <label for="email">Correo Electrónico *</label>
            <div class="input-container">
              <input type="email" id="email" placeholder="correo@ejemplo.com" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- Campo Adicional: Fecha de Alta (Validación cruzada) -->
          <div class="form-group" id="group-fechaRegistro">
            <label for="fechaRegistro">Fecha de Alta *</label>
            <div class="input-container">
              <input type="date" id="fechaRegistro" required>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- Campo Adicional: Radio Group -->
          <div class="form-group full-width" id="group-tipoCliente">
            <label>Tipo de Cliente *</label>
            <div class="options-group">
              <label><input type="radio" name="tipoCliente" value="Particular"> Particular</label>
              <label><input type="radio" name="tipoCliente" value="Comercial"> Comercial</label>
              <label><input type="radio" name="tipoCliente" value="VIP"> VIP</label>
            </div>
            <span class="feedback"></span>
          </div>

          <!-- Campo Adicional: Checkbox Group -->
          <div class="form-group full-width" id="group-preferencias">
            <label>Canales de Contacto Preferidos (Seleccione al menos 1) *</label>
            <div class="options-group">
              <label><input type="checkbox" name="preferencias" value="WhatsApp"> WhatsApp</label>
              <label><input type="checkbox" name="preferencias" value="Email"> Email</label>
              <label><input type="checkbox" name="preferencias" value="Llamada"> Llamada</label>
            </div>
            <span class="feedback"></span>
          </div>

        </div>

        <div class="actions-bar">
          <button type="submit" id="btnGuardar">Guardar Cliente</button>
          <button type="button" class="btn-secondary" id="btnCancelar" style="display:none;">Cancelar Edición</button>
        </div>
      </form>
    </div>

  
  </section>



</div>


</body>
</html>
