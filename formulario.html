<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro</title>
  <script src="scriptformulario.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

      <!--Metodos  pago-->
      <div class="card">
        <h2>Métodos de Pago</h2>
        <p class="subtitle">Seleccione su método de pago preferido.</p>

        <form id="metodoPagoForm" novalidate>
          <div class="form-group full-width" id="group-metodoPago">
            <label>Método de Pago *</label>
            <div class="options-group">
              <select id="metodoPago">
                <option value="">-- Selecciona --</option>
                <option value="efectivo">Efectivo</option>
                <option value="debito">Tarjeta de Débito</option>
                <option value="credito">Tarjeta de Crédito</option>
                <option value="transferencia">Transferencia Bancaria</option>
              </select>
              <span class="status-icon"></span>
            </div>
            <span class="feedback"></span>
          </div>
          <!-- Sección para Efectivo -->
          <div id="infoEfectivo" style="display: none;">
            <p>Aviso: El pago en efectivo es únicamente con retiro en sucursal.</p>
          </div>

          <!-- Sección para Tarjetas (Aquí es donde pide los 16 números) -->
          <div id="infoTarjeta" style="display: none;">
            <h3>Datos de la Tarjeta</h3>
            <div>
              <label>Número de tarjeta:</label>
              <input type="text" id="numTarjeta" maxlength="16" placeholder="XXXX XXXX XXXX XXXX">
            </div>
            <div>
              <label>Fecha de vencimiento:</label>
              <input type="text" id="vencimiento" placeholder="MM/AA">
            </div>
            <div>
              <label>CVV:</label>
              <input type="password" id="cvv" maxlength="4" placeholder="123">
            </div>
            <div>
              <label>Titular:</label>
              <input type="text" id="titular" placeholder="Nombre y apellido">
            </div>
          </div>

          <!-- Sección para Transferencia -->
          <div id="infoTransferencia" style="display: none;">
            <h3>Datos para Transferencia</h3>
            <p>CBU: 0000003100012345678999</p>
            <p>Alias: tienda.digital</p>
            <p>Banco: Banco Galicia</p>
            <p>Titular de la cuenta: JEP S.A</p>
          </div>
          <br>
          <button type="button"id="pagar">Confirmar compra</button>


        </form>
    </section>



  </div>


</body>

</html>
